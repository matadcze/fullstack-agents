repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        files: ^apps/api/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--config", "apps/api/pyproject.toml", "--fix"]
        files: ^apps/api/

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--settings-path", "apps/api/pyproject.toml"]
        files: ^apps/api/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.12.1
    hooks:
      - id: mypy
        args: ["--config-file", "apps/api/pyproject.toml", "apps/api/src"]
        files: ^apps/api/
        pass_filenames: false
        additional_dependencies:
          - types-redis

  - repo: local
    hooks:
      - id: web-lint
        name: web lint
        entry: npm run lint --prefix apps/web
        language: system
        pass_filenames: false
        files: ^apps/web/
      - id: web-format
        name: web format
        entry: npm run format --prefix apps/web
        language: system
        pass_filenames: false
        files: ^apps/web/
