name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Compose profiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Rust scaffold is opt-in
        env:
          COMPOSE_PROFILES: ""
        run: |
          for configuration in default dev prod; do
            case "$configuration" in
              default) set -- -f docker-compose.yml ;;
              dev) set -- -f docker-compose.yml -f docker-compose.override.yml ;;
              prod) set -- -f docker-compose.prod.yml ;;
            esac
            services="$(docker compose "$@" config --no-env-resolution --services)"
            if grep -Fxq rust-svc <<< "$services"; then
              echo "rust-svc must not start by default ($configuration)" >&2
              exit 1
            fi
            docker compose "$@" --profile rust config --no-env-resolution --services | grep -Fx rust-svc
          done

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python with uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: API safety check (pip-audit)
        run: |
          cd apps/api
          uv sync --frozen --group dev
          uv pip install pip-audit
          uv run pip-audit

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Web npm audit (prod)
        run: |
          cd apps/web
          npm ci
          npm audit --production

  api:
    name: API lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python with uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint API
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Test API
        run: uv run pytest -v

  web:
    name: Web lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint

      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps

      # - name: Test web (Playwright)
      #   run: npm run test:e2e
