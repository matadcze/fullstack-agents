name: Container Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run at 6:00 AM UTC every day
    - cron: "0 6 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  scan-api:
    name: Scan API Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build API image
        run: |
          cd apps/api
          docker build -t api:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: api:${{ github.sha }}
          format: sarif
          output: trivy-api-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-api-results.sarif
          category: api-container

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: api:${{ github.sha }}
          format: cyclonedx
          output: api-sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v6
        with:
          name: api-sbom
          path: api-sbom.json
          retention-days: 30

  scan-web:
    name: Scan Web Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build web image
        run: |
          cd apps/web
          docker build -t web:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: web:${{ github.sha }}
          format: sarif
          output: trivy-web-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-web-results.sarif
          category: web-container

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: web:${{ github.sha }}
          format: cyclonedx
          output: web-sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v6
        with:
          name: web-sbom
          path: web-sbom.json
          retention-days: 30
