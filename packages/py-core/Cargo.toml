[package]
name = "py-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "py_core"
crate-type = ["cdylib", "rlib"]

# pyo3 is optional so `cargo test` works without Python installed.
# maturin enables extension-module when building the .so.
[dependencies]
pyo3 = { version = "0.29", optional = true }

[features]
extension-module = ["dep:pyo3", "pyo3/extension-module"]
