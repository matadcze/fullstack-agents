language: rust

tasks:
  build:
    command: >-
      sh -c "maturin build --release ||
             (printf '⚠  py-core: maturin not installed, skipping (pip install maturin)\n' && exit 0)"
    inputs:
      - 'src/**/*.rs'
      - 'Cargo.toml'
      - 'pyproject.toml'

  develop:
    command: maturin develop
    options:
      cache: false
      runInCI: false
    inputs:
      - 'src/**/*.rs'
      - 'Cargo.toml'
