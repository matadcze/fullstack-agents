language: python

tasks:
  dev:
    command: uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000
    options:
      cache: false
      runInCI: false

  test:
    command: uv run pytest -v
    inputs:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'

  lint:
    command: uv run ruff check .
    inputs:
      - 'src/**/*.py'

  typecheck:
    command: uv run mypy --config-file pyproject.toml src
    inputs:
      - 'src/**/*.py'
      - 'pyproject.toml'

  build:
    command: uv build
    # Add dependsOn: ['py-core:build'] once py_core is imported in src/
    inputs:
      - 'src/**/*.py'
      - 'pyproject.toml'
