services:
  api:
    command: uv run uvicorn src.api.app:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
    environment:
      - PYTHONUNBUFFERED=1

  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter frontend dev --hostname 0.0.0.0 --port 3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost
      - NODE_ENV=development
      - NEXT_ENABLE_HSTS=false
      - WATCHPACK_POLLING=true
    volumes:
      - .:/workspace
      - workspace_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - ts_shared_node_modules:/workspace/packages/ts-shared/node_modules

volumes:
  api_venv:
  workspace_node_modules:
  web_node_modules:
  ts_shared_node_modules:
