services:
  api:
    command: uv run uvicorn src.api.app:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
    environment:
      - PYTHONUNBUFFERED=1

  web:
    image: node:22-alpine
    working_dir: /app
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost
      - NODE_ENV=development
      - NEXT_ENABLE_HSTS=false
      - WATCHPACK_POLLING=true
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

volumes:
  api_venv:
  web_node_modules:
